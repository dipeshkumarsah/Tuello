# Local development stack. `docker compose up -d` starts the backing services;
# `docker compose --profile apps up -d --build` also runs api, worker and web in containers.
# Every image is open source. Ports bind to localhost only.
name: tuello

x-app-env: &app-env
  NODE_ENV: development
  APP_BASE_DOMAIN: tuello.localhost
  APP_PUBLIC_PROTOCOL: http
  APP_PUBLIC_PORT: '3000'
  VALKEY_URL: redis://valkey:6379
  COOKIE_SECURE: 'false'
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-ZGV2LW9ubHktZW5jcnlwdGlvbi1rZXktMzItYnl0ZXM=}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: tuello
  S3_ACCESS_KEY_ID: tuello
  S3_SECRET_ACCESS_KEY: tuello-dev-secret
  S3_FORCE_PATH_STYLE: 'true'
  SMTP_URL: smtp://mailpit:1025
  EMAIL_FROM_ADDRESS: no-reply@mail.tuello.localhost

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tuello
      POSTGRES_USER: tuello
      POSTGRES_PASSWORD: tuello
      TUELLO_APP_DB_PASSWORD: tuello_app
    command:
      [
        'postgres',
        '-c',
        'log_min_duration_statement=200',
        '-c',
        'shared_preload_libraries=pg_stat_statements',
      ]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ['127.0.0.1:5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tuello -d tuello']
      interval: 5s
      retries: 20

  # Transaction pooling, as in production. The runtime connects here; migrations go direct.
  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_NAME: tuello
      DB_USER: tuello_app
      DB_PASSWORD: tuello_app
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: '500'
      DEFAULT_POOL_SIZE: '20'
      LISTEN_PORT: '6432'
    depends_on:
      postgres: { condition: service_healthy }
    ports: ['127.0.0.1:6432:6432']

  valkey:
    image: valkey/valkey:8-alpine
    command: ['valkey-server', '--appendonly', 'yes']
    volumes: [valkeydata:/data]
    ports: ['127.0.0.1:6379:6379']
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      retries: 20

  # Local S3-compatible storage. Production uses Cloudflare R2 through the same S3 API.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: tuello
      MINIO_ROOT_PASSWORD: tuello-dev-secret
    volumes: [miniodata:/data]
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 20

  # Creates the private bucket with CORS for direct browser uploads.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 tuello tuello-dev-secret &&
      mc mb --ignore-existing local/tuello &&
      mc anonymous set none local/tuello &&
      echo ok"
    restart: 'no'

  mailpit:
    image: axllent/mailpit:latest
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']

  api:
    profiles: [apps]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *app-env
      PORT: '4000'
      DATABASE_URL: postgresql://tuello_app:tuello_app@pgbouncer:6432/tuello?pgbouncer=true
    depends_on: [pgbouncer, valkey]
    ports: ['127.0.0.1:4000:4000']

  worker:
    profiles: [apps]
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://tuello_app:tuello_app@pgbouncer:6432/tuello?pgbouncer=true
    depends_on: [pgbouncer, valkey, mailpit]

  web:
    profiles: [apps]
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment:
      APP_BASE_DOMAIN: tuello.localhost
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]
    ports: ['127.0.0.1:3000:3000']

volumes:
  pgdata:
  valkeydata:
  miniodata:
